services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://geest:geest@postgres:5432/geest
      DATABASE_SSL: "false"
      NOTIFY_URL: ${NOTIFY_URL:-https://httpbin.org/status/200}
      NOTIFY_TIMEOUT_MS: 5000
      NOTIFY_RETRY_BASE_MS: 1000
      NOTIFICATION_POLL_INTERVAL_MS: 1000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: geest
      POSTGRES_USER: geest
      POSTGRES_PASSWORD: geest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geest -d geest"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - geest_postgres_data:/var/lib/postgresql/data

volumes:
  geest_postgres_data:
