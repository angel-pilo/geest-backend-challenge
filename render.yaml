services:
  - type: web
    name: geest-backend-challenge
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geest-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: NOTIFY_URL
        sync: false
      - key: NOTIFY_TIMEOUT_MS
        value: "5000"
      - key: NOTIFY_RETRY_BASE_MS
        value: "1000"
      - key: NOTIFICATION_POLL_INTERVAL_MS
        value: "1000"

databases:
  - name: geest-postgres
    databaseName: geest
    user: geest
    plan: free
    region: oregon
    postgresMajorVersion: "17"
